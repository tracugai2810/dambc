<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620">
  <defs>
    <filter id="blurName2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4.5" />
    </filter>
  </defs>
  <rect width="640" height="620" fill="#E5EFF5" rx="16"/>
  <rect x="24" y="24" width="592" height="572" fill="#FFFFFF" rx="14" stroke="#D0DCE5" stroke-width="1.5"/>
  <!-- Thanh top chat -->
  <rect x="24" y="24" width="592" height="56" rx="14" fill="#0068FF"/>
  <rect x="44" y="42" width="130" height="16" rx="4" fill="#FFFFFF" opacity="0.85" filter="url(#blurName2)"/>
  <text x="588" y="57" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#DBEAFE">Tin nhắn phản hồi Tử Vi</text>
  <!-- Tin nhắn luận giải -->
  <rect x="140" y="106" width="452" height="144" rx="14" fill="#E5EFFF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="160" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1E40AF">Bùi Công Đam</text>
  <text x="160" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#1E293B">Lá số này đại vận đang đi vào cung Thiên Di có Thiên Cơ – Thái Âm</text>
  <text x="160" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#1E293B">gặp Hóa Lộc, tiểu vận năm nay lưu Lộc Tồn chiếu về Điền Trạch.</text>
  <text x="160" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#1E293B">Nửa cuối năm âm lịch dễ có duyên chốt được đất/nhà hoặc sửa sang</text>
  <text x="160" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#1E293B">nơi ở mới, nhưng chú ý giấy tờ pháp lý tháng 8 âm kẻo nhầm lẫn.</text>
  <!-- Phản hồi khách -->
  <rect x="48" y="274" width="470" height="248" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="68" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#475569">Đương số phản hồi (3 tháng sau)</text>
  <text x="68" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#0F172A">Anh Đam ơi em vào báo nghiệm lý cho anh đây ạ.</text>
  <text x="68" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#0F172A">Tháng 8 âm đúng như anh dặn, suýt nữa em ký nhầm hợp đồng cọc</text>
  <text x="68" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#0F172A">căn hộ vướng quy hoạch, nhớ lời anh dặn nên em kiểm tra kỹ lại sổ</text>
  <text x="68" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#0F172A">nên tránh được một pha mất tiền oan.</text>
  <text x="68" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#0F172A">Sang tháng 10 âm vừa rồi vợ chồng em đã mua được căn ưng ý hơn,</text>
  <text x="68" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#0F172A">giá lại tốt hơn căn trước. Cảm ơn anh luận lá số rất có tâm!</text>
  <text x="68" y="488" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748B">Ảnh minh họa mẫu — Có thể dán ảnh thật bằng Ctrl + V trong /admin</text>
</svg>
